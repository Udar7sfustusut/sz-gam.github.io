<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sz Games</title>
  <link rel="icon" href="https://github.com/sz-games/home/blob/main/G.png?raw=true">

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-C78TXR0XFK"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-C78TXR0XFK');
  </script>

  <!-- Ruffle (for Flash emulation) -->
  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

  <style>
    body {
      margin: 0;
      background-color: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    .header {
      padding: 60px;
      text-align: center;
      background: linear-gradient(to bottom right, #9a9a9a, rgb(39, 39, 39));
      color: white;
      font-size: 30px;
      border-radius: 15px;
    }

    .btn-group button {
      background-color: black;
      color: white;
      padding: 10px 24px;
      cursor: pointer;
      float: left;
    }

    .btn-group:after {
      content: "";
      clear: both;
      display: table;
    }

    .btn-group button:not(:last-child) {
      border-right: none;
    }

    .btn-group button:hover {
      background-color: grey;
    }

    .game {
      position: absolute;
      transform: scale(1.8);
      z-index: 3;
    }

    .fade {
      position: absolute;
      background: linear-gradient(to bottom, #1d1d1d, #1d1d1d5d, rgba(39, 39, 39, 0));
      width: 300px;
      height: 150px;
      border-radius: 15px;
    }

    iframe {
      width: 100%;
      border: none;
      display: block;
    }

    .controls {
      position: fixed;
      bottom: 10px;
      width: 100%;
      text-align: center;
    }

    .controls h2 {
      cursor: pointer;
      margin: 5px;
      display: inline-block;
    }
  </style>
</head>
<body onresize="resizeIframe()">

  <iframe id="game" src="https://hwugifijifjjhijsoohsoohhdhosjijihfijo.netlify.app/games/blox.html" allowfullscreen></iframe>

  <div class="controls">
    <h2 onclick="location.href='https://hwugifijifjjhijsoohsoohhdhosjijihfijo.netlify.app'">Back</h2>
    <h2>____</h2>
    <h2 onclick="makeFullScreen()">Fullscreen</h2>
  </div>

  <script>
    function requestFullScreen(element) {
      var requestMethod = element.requestFullscreen || element.webkitRequestFullscreen || element.mozRequestFullScreen || element.msRequestFullscreen;
      if (requestMethod) {
        requestMethod.call(element);
      }
    }

    function makeFullScreen() {
      var iframe = document.getElementById('game');
      requestFullScreen(iframe);
    }

    function resizeIframe() {
      let hh = window.innerHeight - 10;
      document.getElementById('game').height = hh;
    }

    window.onload = resizeIframe;
    window.onresize = resizeIframe;

    document.body.onkeyup = function(e) {
      if (e.key === "Escape") {
        document.getElementById('game').style.width = '800px';
      }
    };
  </script>
</body>
</html>
